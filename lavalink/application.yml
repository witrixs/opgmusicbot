server:
  port: 2333
  address: 0.0.0.0

lavalink:
  server:
    password: "" # Пароль
    sources:
      youtube: false  # Отключаем встроенный источник
  plugins:
    # 1.18.2: TV падает с "The page needs to be reloaded". Snapshot с фиксом.
    - dependency: "dev.lavalink.youtube:youtube-plugin:2be8e542d3f6f178e048dca565892684c2e40177"
      snapshot: true

plugins:
  youtube:
    enabled: true
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true
    # TV первым — единственный клиент с OAuth. Дальше MWEB/IOS и т.д.
    clients:
      - MUSIC
      - TV
      - MWEB
      - IOS
      - ANDROID_MUSIC
      - WEBEMBEDDED
      - WEB
    # OAuth — самый надёжный способ обойти блокировки. Чтобы включить:
    #  1) поставить enabled: true и убрать refreshToken;
    #  2) при первом запуске Lavalink в логах появится ссылка и код для входа
    #     в аккаунт Google (используйте отдельный/не основной аккаунт!);
    #  3) после авторизации Lavalink выведет refreshToken — вставьте его сюда.
    # Пустой refreshToken при enabled: true ничего не делает, поэтому пока выключено.
    oauth:
      enabled: false
      # refreshToken: "" # Токен YouTube
      # skipInitialization: true
    # Локальный cipher сломан (Must find sig function). Нужен remoteCipher.
    # Публичный инстанс — быстрый старт; для продакшена лучше свой yt-cipher.
    remoteCipher:
      url: "https://cipher.kikkia.dev/"
      userAgent: "opgmusicbot"